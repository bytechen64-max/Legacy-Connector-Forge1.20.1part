plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

// The root project is the *runtime* half of MC Compatibility: a normal Forge mod that contains the
// re-implemented legacy APIs (the "shim", packages legacyconnector.v1_7_10 / legacyconnector.v1_12_2) and the bridges
// that connect them to Forge. The :loader project is the service-layer half that translates jars.
evaluationDependsOn(':loader')

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.theillusivec4.top/' } // Curios (Baubles bridge)
    maven { url = 'https://maven.blamejared.com/' } // JEI (NEI bridge)
    maven { // Jade (Waila bridge)
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // Forge itself (ForgeGradle resolves the userdev artifact from here) and TerraBlender
    // (legacy biomes placed as a TerraBlender region when it is installed).
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { // Create (contraption movement checks for legacy blocks)
        url = 'https://maven.createmod.net'
        content { includeGroup 'com.simibubi.create' }
    }
}

base {
    archivesName = mod_id
}

// Forge 1.20.1 runs on Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def shimIndexFile = layout.buildDirectory.file('generated/shimIndex/legacyconnector/shim-index.txt')

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
    // The shim mirrors the FML access transformers 1.7.10/1.12.2 mods were compiled against. The source file is written
    // with official names: ForgeGradle applies it to the development mappings (compile and run), while the jar gets the
    // SRG-remapped copy from remapAccessTransformer -- Forge's runtime never translates AT member names itself.
    accessTransformer = file('config/accesstransformer.cfg')

    // ForgeGradle fills the launch target, the module path and the JVM arguments (--add-opens for the secure jar handler) into
    // the built-in client/server runs only; a run config of its own starts without them. The test runs therefore reuse those two:
    // the requested task name picks the working directory and the self-test properties.
    def requested = gradle.startParameter.taskNames.collect { it.tokenize(':').last().toLowerCase(Locale.ROOT) }
    def asked = { String name -> requested.contains(name.toLowerCase(Locale.ROOT)) }

    runs {
        client {
            client true
            workingDirectory project.file(asked('runClientTest') ? 'run-clienttest' : asked('screenshotTest') ? 'run-screenshots' : 'run')
            property 'forge.logging.markers', 'REGISTRIES'
            jvmArg '-Xmx6G'
            if (asked('runClientTest')) property 'legacyconnector.clientSelfTest', 'true'
            if (asked('screenshotTest')) {
                property 'legacyconnector.screenshotTest', 'true'
                ['shotWorldType', 'shotMods', 'shotBlocksPerMod', 'shotItemsPerMod', 'shotTour', 'shotSeed', 'shotScenario', 'shotRenderDistance', 'shotBlocks', 'shotItems', 'shotEntities', 'shotMetas', 'shotCommands', 'debugIcons', 'debugAssets', 'debugAsm'].each { p ->
                    if (project.hasProperty(p)) property 'legacyconnector.' + p, project.property(p)
                }
                if (project.hasProperty('shotWidth') && project.hasProperty('shotHeight')) {
                    args '--width'
                    args project.property('shotWidth').toString()
                    args '--height'
                    args project.property('shotHeight').toString()
                }
            }
            mods {
                legacyconnector { source sourceSets.main }
            }
        }

        server {
            client false
            workingDirectory project.file(asked('runServerSubTest') ? 'run-subtest'
                    : asked('runServerTest') ? 'run-servertest'
                    : (project.findProperty('runDir') ?: 'run'))
            args '--nogui'
            // The test runs stop the server after the fixture mod's self test; -Pautostop=true does the same for a plain run.
            property 'legacytest.autostop', asked('runServerSubTest') || asked('runServerTest') ? 'true'
                    : (project.findProperty('autostop') ?: System.getProperty('legacytest.autostop', 'false'))
            if (asked('runServerTest')) property 'legacyconnector.entitySelfTest', 'true'
            if (asked('runServerSubTest')) {
                property 'legacyconnector.autostopTicks', project.findProperty('autostopTicks') ?: '700'
                // runs the client blockstate translation on the server too (logs "1.12.2 blockstates: N translated, M fell back");
                // -PassetsDump=<dir> writes it
                property 'legacyconnector.assetsSelfTest', project.findProperty('assetsDump') ?: 'true'
                // -PclientProxies=mekanism.client.ClientProxy,...: runs those mods' client registrations (state mappers) too
                if (project.hasProperty('clientProxies')) property 'legacyconnector.assetsClientProxies', project.property('clientProxies')
                property 'legacyconnector.entitySelfTest', project.findProperty('selfTests') ?: 'true'
                // -PserverTickScript=<file.js>: runs that JavaScript on every server tick (see core/ServerTickScript)
                if (project.hasProperty('serverTickScript')) {
                    property 'legacyconnector.serverTickScript', project.property('serverTickScript')
                    property 'legacyconnector.serverTickScriptFrom', project.findProperty('serverTickScriptFrom') ?: '200'
                }
                // -PserverDevScript=<dir>: evaluates dir/*.js once on the server thread (core/ServerDevScript)
                if (project.hasProperty('serverDevScript')) property 'legacyconnector.serverDevScript', project.property('serverDevScript')
                // -PserverScript=<dir>: long-lived script console (core/ServerScript); -PserverScriptMod=<legacy mod id>
                if (project.hasProperty('serverScript')) property 'legacyconnector.serverScript', project.property('serverScript')
                if (project.hasProperty('serverScriptMod')) property 'legacyconnector.serverScriptMod', project.property('serverScriptMod')
                // -PgenTiming: per-generator timing of the legacy world generators (a log line every 20 s and at shutdown)
                if (project.hasProperty('genTiming')) property 'legacyconnector.genTiming', 'true'
            }
            mods {
                legacyconnector { source sourceSets.main }
            }
        }

        configureEach {
            if (project.hasProperty('embeddedLibs')) property 'legacyconnector.libsDir', layout.buildDirectory.dir('legacy-libs').get().asFile.absolutePath
            property 'forge.logging.markers', 'REGISTRIES'
            // In production the loader reads the index from the embedded runtime jar.
            property 'legacyconnector.shimIndex', shimIndexFile.get().asFile.absolutePath
            // ... and legacy coremods' FML classes from the runtime jar; in development, from its compiled classes.
            property 'legacyconnector.runtimeClasses', sourceSets.main.java.classesDirectory.get().asFile.absolutePath
        }
    }
}

// The test runs reuse ForgeGradle's own client/server run (see above): these names only start it with the matching setup.
['runServerSubTest', 'runServerTest', 'runClientTest', 'screenshotTest'].each { name ->
    def target = name in ['runClientTest', 'screenshotTest'] ? 'runClient' : 'runServer'
    tasks.register(name) {
        group = 'forgegradle runs'
        description = "Runs $target with the ${name} working directory and self-test settings."
        dependsOn target
    }
}

// ForgeGradle 6 fills the launch target, the module path and the JVM arguments (--add-opens for the secure jar handler) into the
// built-in client/server runs only, so every extra run starts from the same setup; its own arguments are kept.
gradle.projectsEvaluated {
    def runs = minecraft.runs
    runs.each { run ->
        if (run.name == 'client' || run.name == 'server') return
        def base = run.isClient() ? runs.getByName('client') : runs.getByName('server')
        run.setJvmArgs(new ArrayList<String>(base.getJvmArgs()))
        def own = run.getArgs().findAll { it != '--nogui' }
        run.setArgs(new ArrayList<String>(base.getArgs()) + own)
    }
}

configurations {
    // Modern Forge mods loaded by Forge's dependency locator from the embedded runtime mod.
    bundledMods { transitive = false }
    // The legacy-era libraries embedded as resources of the distributable jar (see the comment at their declaration).
    legacyLibs { transitive = false }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // The loader must sit on the boot/service layer in development, exactly like in production.
    implementation project(':loader')

    // Optional integrations: only used when the mod is installed (legacy library bridges).
    compileOnly "top.theillusivec4.curios:curios-forge:${curios_version}:api"
    compileOnly "maven.modrinth:jade:${jade_version}"
    compileOnly "mezz.jei:jei-1.20.1-forge-api:${jei_version}"
    compileOnly("maven.modrinth:create:${create_version}") { transitive = false }
    compileOnly("com.github.glitchfiend:TerraBlender-forge:${terrablender_version}") { transitive = false }

    // Pehkui (MIT, Modrinth): entity size scaling (hitbox, eye height, model). Legacy Entity.setSize / eyeHeight and Fisk's Heroes' size
    // manipulation go through its ScaleTypes API instead of our own dimension mixin. NeoForge embedded it with jarJar; Forge 1.20.1 has
    // no jarJar DSL in ForgeGradle, so the bundle task nests it (see bundleJar) and it stays optional at compile time.
    compileOnly("maven.modrinth:pehkui:${pehkui_version}") { transitive = false }

    // Libraries Minecraft 1.7.10 / 1.12.2 shipped and legacy mods use directly, absent from 1.20.1. NOT nested in the mods layer: a nested
    // library always enters the game module layer, and a modern mod that bundles the same packages (ScalableCatsForce ships Scala 2.13) then stops
    // the launch with "Modules X and Y export package scala.annotation". They are plain resources of the distributable jar
    // (META-INF/legacyconnector/libs); the loader's BundledLibraries hands each one to FML only when a legacy mod uses it and the
    // rest of the pack does not already provide it. In development they stay on the class path.
    for (lib in ['net.sf.trove4j:trove4j:3.0.3', 'javax.vecmath:vecmath:1.5.2',
                 // Forge 1.7.10 shipped Scala 2.11 for Scala mods (ProjectRed, ForgeMultipart, ...).
                 'org.scala-lang:scala-library:2.11.1', 'org.scala-lang:scala-reflect:2.11.1',
                 'org.scala-lang.modules:scala-parser-combinators_2.11:1.0.1', 'org.scala-lang.modules:scala-xml_2.11:1.0.2',
                 // Forge 1.12.2 put typesafe config and akka on the game classpath too (OpenComputers' Scala code uses both; Apache 2.0, ~3 MB).
                 'com.typesafe:config:1.2.1', 'com.typesafe.akka:akka-actor_2.11:2.3.3',
                 // Java 8 had javax.activation (removed from the JDK in 11); 1.12.2 mods use it for MIME types (Silent Lib, Scaling Health).
                 'com.sun.activation:jakarta.activation:1.2.2']) {
        legacyLibs(lib)
        if (project.hasProperty('embeddedLibs')) {
            // test mode: the libraries are NOT on the run class path; the loader reads them from build/legacy-libs like the production jar's resources
            compileOnly lib
        } else {
            implementation lib
        }
    }
    // Java 8 shipped Nashorn (legacy mods script with jdk.nashorn, relocated to the standalone engine; the dev remote control
    // evaluates JavaScript with it too). Forge 1.20.1 ships the same engine for its coremods, so it is not embedded: a second
    // copy in the game layer stops the game from starting ("Module scala.reflect reads more than one module named
    // org.openjdk.nashorn").
    compileOnly 'org.openjdk.nashorn:nashorn-core:15.4'

    // Compile against the common API; distribute the Forge bootstrap as an unmodified nested mod.
    compileOnly "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    bundledMods "io.github.llamalad7:mixinextras-forge:${mixin_extras_version}"

    // Mixin's annotation processor: generates the refmap for the mixin configs. 1.20.1 Forge runs Minecraft with SRG
    // member names (m_/f_) while the sources use official names; without the refmap every @Accessor/@Shadow/injection
    // target is looked up by its official name and the launch dies in "No candidates were found matching ...".
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    // Unit tests of the pure logic of the addon API (api.internal.AddonOrder).
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }

// ---------------------------------------------------------------------------------------------------------
// Production names. Forge 1.20.1 runs Minecraft with SRG member names (f_12345_ / m_12345_), while the sources are
// written with the official names ForgeGradle maps them to in development. Two generated files translate the mod:
//   * legacyconnector.refmap.json -- the Mixin annotation processor rewrites every member a mixin names (@Accessor,
//     @Shadow, @Inject/@Redirect targets) from official to SRG; the mixin configs load it in production.
//   * META-INF/accesstransformer.cfg in the jar -- remapAccessTransformer does the same for the access transformer.
//     Forge applies ATs by SRG name at runtime and never remaps them itself (see PORTING.md).
// ---------------------------------------------------------------------------------------------------------
def mixinRefmapFile = layout.buildDirectory.file('generated/mixin/legacyconnector.refmap.json')
// @Shadow members are not in the refmap: Mixin resolves them by their declared name, so the processor's SRG mapping of
// shadow (and @Overwrite) declarations is merged into reobfJar, which renames them in the compiled mixin class.
def mixinShadowMappingsFile = layout.buildDirectory.file('generated/mixin/legacyconnector.shadow-mappings.tsrg')
def srgMappingsFile = layout.buildDirectory.file('createMcpToSrg/output.tsrg')

tasks.named('compileJava', JavaCompile) {
    dependsOn 'createMcpToSrg'
    options.compilerArgs += [
            '-AoutRefMapFile=' + mixinRefmapFile.get().asFile.absolutePath,
            '-AoutTsrgFile=' + mixinShadowMappingsFile.get().asFile.absolutePath,
            // FG3 mapping provider: build/createMcpToSrg/output.tsrg maps official -> SRG (tsrg2).
            '-AmappingTypes=tsrg',
            '-AreobfTsrgFile=' + srgMappingsFile.get().asFile.absolutePath,
            '-AdefaultObfuscationEnv=searge'
    ]
}

// reobfJar merges the mixin processor's shadow mappings into the official -> SRG table it applies, so a @Shadow field
// or method is already named like the target in production (Mixin would otherwise search for the official name).
tasks.matching { it.name == 'reobfJar' }.configureEach {
    extraMappings.from(mixinShadowMappingsFile)
}

// Reflection on Minecraft's own members has to work in both runs: the development game has the official names a mod is compiled
// against, an installed one the SRG names. core/Mirror reads this table, which is the ForgeGradle mapping filtered to the member
// names that appear in our own classes (so it stays small).
def mirrorTable = layout.buildDirectory.file('generated/mirror/legacyconnector/mirror.tsrg')
tasks.register('generateMirrorTable') {
    group = 'build'
    description = 'Writes the official -> SRG member names core/Mirror needs in an installed game.'
    def output = mirrorTable
    inputs.file(srgMappingsFile)
    inputs.files(sourceSets.main.output.classesDirs)
    outputs.file(output)
    dependsOn 'createMcpToSrg'
    dependsOn 'compileJava'
    doLast {
        // every identifier-shaped run of bytes in our classes: the member names a reflection site can use
        Set<String> names = new HashSet<>()
        sourceSets.main.output.classesDirs.each { dir ->
            if (!dir.exists()) return
            dir.eachFileRecurse { file ->
                if (!file.name.endsWith('.class')) return
                byte[] bytes = file.bytes
                StringBuilder run = new StringBuilder()
                for (int i = 0; i < bytes.length; i++) {
                    int b = bytes[i] & 0xFF
                    if ((b >= (int) 'a' && b <= (int) 'z') || (b >= (int) 'A' && b <= (int) 'Z')
                            || (b >= (int) '0' && b <= (int) '9') || b == (int) '_' || b == (int) '$') {
                        run.append((char) b)
                    } else {
                        if (run.length() >= 3) names.add(run.toString())
                        run.setLength(0)
                    }
                }
                if (run.length() >= 3) names.add(run.toString())
            }
        }
        File out = output.get().asFile
        out.parentFile.mkdirs()
        String owner = null
        out.withWriter('UTF-8') { writer ->
            srgMappingsFile.get().asFile.eachLine('UTF-8') { String raw ->
                if (raw.startsWith('#') || raw.startsWith('tsrg2') || raw.isEmpty()) return
                if (!raw.startsWith('\t')) {
                    owner = raw.split('\\s+')[0]
                    return
                }
                if (raw.startsWith('\t\t') || owner == null) return
                if (!owner.startsWith('net/minecraft/') && !owner.startsWith('net/minecraftforge/')) return
                String[] parts = raw.substring(1).trim().split('\\s+')
                if (parts.length == 2) {
                    if (parts[0].startsWith('<') || !names.contains(parts[0])) return
                    writer.write("F ${owner} ${parts[0]} ${parts[1]}\n")
                } else if (parts.length == 3) {
                    if (parts[0].startsWith('<') || parts[0].startsWith('lambda$') || !names.contains(parts[0])) return
                    writer.write("M ${owner} ${parts[0]} ${parts[2]}\n")
                }
            }
        }
        logger.info("Mirror table: {} ({} bytes)", out, out.length())
    }
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/mirror'))
tasks.named('processResources', ProcessResources) {
    dependsOn 'generateMirrorTable'
}

// Rewrites the official-named access transformer into the SRG names Forge's runtime matches against.
def remapAccessTransformer = tasks.register('remapAccessTransformer') {
    group = 'build'
    description = 'Remaps config/accesstransformer.cfg to SRG member names for the distributable jar.'
    def source = file('config/accesstransformer.cfg')
    def output = layout.buildDirectory.file('generated/at/accesstransformer.cfg')
    inputs.file(source)
    inputs.file(srgMappingsFile)
    outputs.file(output)
    dependsOn 'createMcpToSrg'
    doLast {
        Map<String, Map<String, String>> fields = [:]
        Map<String, Map<String, String>> methods = [:]
        String owner = null
        srgMappingsFile.get().asFile.eachLine('UTF-8') { String raw ->
            if (raw.startsWith('#') || raw.startsWith('tsrg2')) return
            if (!raw.startsWith('\t')) {
                owner = raw.split('\\s+')[0]
                fields[owner] = [:]
                methods[owner] = [:]
                return
            }
            if (raw.startsWith('\t\t')) return // "static" markers and parameter maps
            String[] parts = raw.substring(1).trim().split('\\s+')
            if (parts.length == 2) {
                fields[owner][parts[0]] = parts[1]
            } else if (parts.length == 3) {
                methods[owner][parts[0] + parts[1]] = parts[2]
            }
        }
        def result = new StringBuilder()
        source.eachLine('UTF-8') { String line ->
            def stripped = line.trim()
            if (stripped.isEmpty() || stripped.startsWith('#')) {
                result.append(line).append('\n')
                return
            }
            def body = line
            def comment = ''
            int hash = line.indexOf('#')
            if (hash >= 0) {
                body = line.substring(0, hash)
                comment = line.substring(hash)
            }
            String[] parts = body.trim().split('\\s+')
            if (parts.length >= 3) {
                String cls = parts[1].replace('.', '/')
                String member = parts[2]
                int paren = member.indexOf('(')
                String mapped = paren >= 0
                        ? methods[cls]?.get(member)
                        : fields[cls]?.get(member)
                if (mapped != null) {
                    // Methods and constructors keep their descriptor: only the name is remapped.
                    parts[2] = paren >= 0 ? mapped + member.substring(paren) : mapped
                    result.append(parts.join(' '))
                    if (comment) result.append(' ').append(comment.trim())
                    result.append('\n')
                    return
                }
                logger.warn("remapAccessTransformer: {} has no SRG mapping for {} (left as is)", cls, member)
            }
            result.append(line).append('\n')
        }
        output.get().asFile.parentFile.mkdirs()
        output.get().asFile.setText(result.toString(), 'UTF-8')
    }
}

// The addon API alone (classes + sources), the compile-time dependency of addons: build/dist/legacyconnector-api-<version>.jar.
// Not a mod: at runtime the API is part of the Legacy Connector jar.
tasks.register('apiJar', Jar) {
    group = 'build'
    description = 'Builds the jar addons compile against (only org.kylepitcock.legacyconnector.api, without api.internal).'
    dependsOn tasks.named('classes')
    archiveBaseName = 'legacyconnector-api'
    archiveVersion = project.version
    destinationDirectory = layout.buildDirectory.dir('dist')
    from(sourceSets.main.output.classesDirs) {
        include 'org/kylepitcock/legacyconnector/api/**'
    }
    from(sourceSets.main.java.srcDirs) {
        include 'org/kylepitcock/legacyconnector/api/**'
        exclude 'org/kylepitcock/legacyconnector/api/internal/**'
    }
}

// The run configurations reference the loader's jar by path; without this they would launch a stale loader.
tasks.matching { it.name.startsWith('run') || (it.name.startsWith('prepare') && it.name.endsWith('Run')) }.configureEach {
    dependsOn ':loader:jar'
}

// ---------------------------------------------------------------------------------------------------------
// Shim index: every legacy API class/member the runtime provides. The loader uses it to drop duplicate
// copies of Forge classes from legacy jars and to report APIs a legacy mod needs that are not implemented.
// ---------------------------------------------------------------------------------------------------------
def generateShimIndex = tasks.register('generateShimIndex', JavaExec) {
    dependsOn tasks.named('compileJava')
    classpath = project(':loader').sourceSets.main.runtimeClasspath
    mainClass = 'org.kylepitcock.legacyconnector.loader.shim.ShimIndexGenerator'
    def classDirs = sourceSets.main.output.classesDirs
    inputs.files classDirs
    outputs.file shimIndexFile
    argumentProviders.add({ [shimIndexFile.get().asFile.absolutePath] + classDirs.files.collect { it.absolutePath } } as CommandLineArgumentProvider)
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/shimIndex'))
tasks.named('processResources') { dependsOn generateShimIndex }

// Compile-only "legacy API" jars that look like the original Forge/Minecraft API to a Java 8 compiler.
['1_7_10', '1_12_2'].each { ver ->
    tasks.register("legacyApiStubs${ver}", JavaExec) {
        dependsOn tasks.named('compileJava')
        classpath = project(':loader').sourceSets.main.runtimeClasspath
        mainClass = 'org.kylepitcock.legacyconnector.loader.shim.LegacyApiStubGenerator'
        def classDir = sourceSets.main.java.classesDirectory
        def out = layout.buildDirectory.file("legacy-api/legacy-api-${ver}.jar")
        inputs.dir classDir
        outputs.file out
        argumentProviders.add({ [classDir.get().asFile.absolutePath, "legacyconnector/v${ver}/".toString(), out.get().asFile.absolutePath] } as CommandLineArgumentProvider)
    }
}

// Offline compatibility check: ./gradlew checkLegacyMod -PlegacyJar=/path/to/mod.jar
tasks.register('checkLegacyMod', JavaExec) {
    dependsOn generateShimIndex
    classpath = project(':loader').sourceSets.main.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'org.kylepitcock.legacyconnector.loader.tools.CheckJar'
    argumentProviders.add({ [shimIndexFile.get().asFile.absolutePath] + (project.findProperty('legacyJar') ?: '').toString().split(',').findAll { it } } as CommandLineArgumentProvider)
}

// Offline report of the texture modernizer: ./gradlew textureReport -PlegacyJar=a.jar,b.jar [-PmodernClient=1.20.1.jar] [-PsampleDir=dir]
// prints which textures of each jar are old vanilla copies or backgrounds and writes before/after samples.
tasks.register('textureReport', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.kylepitcock.legacyconnector.core.pack.TextureModernizer'
    argumentProviders.add({
        def client = project.findProperty('modernClient') ?: "${System.getenv('APPDATA') ?: System.getProperty('user.home')}/.minecraft/versions/1.20.1/1.20.1.jar"
        def samples = project.findProperty('sampleDir') ?: layout.buildDirectory.dir('texture-samples').get().asFile.absolutePath
        [client.toString(), samples.toString()] + (project.findProperty('legacyJar') ?: '').toString().split(',').findAll { it }
    } as CommandLineArgumentProvider)
}

// Offline checks that run shim code against vanilla registries only (no game, no mods loaded): src/devcheck.
sourceSets {
    devcheck {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
// Thaumcraft 4's vanilla aspect keys vs the modern -> legacy item/block round trip, plus legacy numeric ids of all vanilla
// content: ./gradlew checkVanillaAspects -PlegacyJar=/path/to/Thaumcraft-1.7.10-4.2.3.5.jar
tasks.register('checkVanillaAspects', JavaExec) {
    dependsOn tasks.named('devcheckClasses'), ':loader:extractMappings'
    classpath = sourceSets.devcheck.runtimeClasspath
    mainClass = 'org.kylepitcock.legacyconnector.devcheck.CheckVanillaAspects'
    def fields = project(':loader').layout.buildDirectory.file('generated/mappings/legacyconnector/mappings/1.7.10/fields.csv')
    argumentProviders.add({ [fields.get().asFile.absolutePath, (project.findProperty('legacyJar') ?: '').toString()] } as CommandLineArgumentProvider)
}

// Copies the fixture legacy mods into run/mods so `runServer` / `runClient` exercise the full pipeline.
tasks.register('installTestMods', Copy) {
    dependsOn ':testmods:assemble'
    from project(':testmods').layout.buildDirectory.dir('libs')
    include 'LegacyTest-*.jar'
    into layout.projectDirectory.dir('run/mods')
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             forge_version          : forge_version,
                             forge_version_range    : forge_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Report every error in one run: the port fixes them by category, not one at a time.
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

// The bundled legacy-era libraries plus an index.txt listing them: embedded in the distributable jar under META-INF/legacyconnector/libs
// and read from here with -PembeddedLibs (the loader's -Dlegacyconnector.libsDir).
def syncLegacyLibs = tasks.register('syncLegacyLibs', Sync) {
    from(configurations.legacyLibs)
    into layout.buildDirectory.dir('legacy-libs')
    doLast {
        def names = destinationDir.listFiles().findAll { it.name.endsWith('.jar') }*.name.sort()
        new File(destinationDir, 'index.txt').text = names.join('\n') + '\n'
    }
}
tasks.matching { it.name.startsWith('run') || (it.name.startsWith('prepare') && it.name.endsWith('Run')) }.configureEach {
    if (project.hasProperty('embeddedLibs')) dependsOn syncLegacyLibs
}

// ---------------------------------------------------------------------------------------------------------
// Distribution: ONE jar for players. It is the loader (an FML service, picked up from the mods folder) with
// the runtime mod embedded; the loader extracts and registers the runtime mod at discovery time.
// ---------------------------------------------------------------------------------------------------------
// Generate Forge's standard JiJ metadata inside the runtime mod, which our locator hands to FML.
// The outer bundle is a service-layer jar, so putting JiJ metadata only there would bypass mod dependency discovery.
def bundledModResources = layout.buildDirectory.dir('generated/bundledMods')
def generateBundledMods = tasks.register('generateBundledMods', Sync) {
    from(configurations.bundledMods) { into 'META-INF/jarjar' }
    into bundledModResources
    inputs.property('mixinExtrasVersion', mixin_extras_version)
    doLast {
        def jars = configurations.bundledMods.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
            def id = artifact.moduleVersion.id
            [identifier: [group: id.group, artifact: id.name],
             version: [range: "[${id.version},)", artifactVersion: id.version],
             path: "META-INF/jarjar/${artifact.file.name}", isObfuscated: false]
        }
        new File(destinationDir, 'META-INF/jarjar/metadata.json').text =
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([jars: jars])) + '\n'
    }
}
sourceSets.main.resources.srcDir(generateBundledMods)

// The plain runtime jar is only an input of the bundle: dropped into a mods folder alone it has no loader, so Forge rejects every
// legacy mod as built for an old Minecraft. A distinct classifier keeps it from being mistaken for the distributable.
tasks.named('jar') {
    archiveClassifier = 'runtime-only'
    if (project.hasProperty('withoutBundledMods')) exclude 'META-INF/jarjar/**'
    from('LICENSE', 'THIRD_PARTY_NOTICES.md', 'PORT_NOTICE.md')
    from('licenses') { into 'META-INF/licenses' }
    // The mixin refmap the annotation processor produced (SRG names, see the section above).
    from(mixinRefmapFile)
    // The SRG-remapped access transformer; the official-named source stays out of the jar (it is for the dev environment).
    from(remapAccessTransformer) {
        into 'META-INF'
    }
    // Forge 1.20.1 reads the mixin configs a mod ships from its manifest (ForgeGradle has no mods.toml [[mixins]] section).
    manifest {
        attributes(
                'MixinConfigs': 'legacyconnector.mixins.json,legacyconnector.compat.mixins.json',
                // FMLModContainer resolves a mod's class with gameLayer.findModule(ModFileInfo.moduleName()), and
                // ModFileInfo.moduleName() is the first mods.toml modId: the module name has to be the mod id.
                'Automatic-Module-Name': 'legacyconnector',
                // The runtime is a named module, so the JVM ignores the launcher's --add-opens for it; legacy mods that reach
                // into the JDK (sun.* tricks, reflection on internals) need these opened to this module, and the manifest is
                // the only place a modular jar can ask for it.
                'Add-Opens': 'java.base/java.lang java.base/java.lang.invoke java.base/java.lang.reflect java.base/java.util '
                        + 'java.base/java.util.concurrent java.base/java.util.zip java.base/java.io java.base/java.nio '
                        + 'java.base/java.nio.charset java.base/java.net java.base/java.text java.base/java.math'
        )
    }
}

tasks.register('bundleJar', Jar) {
    group = 'build'
    description = 'Builds the single distributable jar (loader service + embedded runtime mod).'
    archiveBaseName = 'legacyconnector-forge-1.20.1'
    archiveVersion = project.version
    // Keep player files distinguishable even when both variants share the same mod version.
    archiveClassifier = project.hasProperty('withoutBundledMods') ? 'nojarinjar' : 'jarinjar'
    destinationDirectory = layout.buildDirectory.dir('dist')
    def loaderJar = project(':loader').tasks.named('jar')
    def runtimeJar = tasks.named('jar')
    // reobfJar rewrites the runtime jar's member names to SRG in place (RenameJarInPlace); the bundle must embed the
    // result, not the named jar `jar` just produced -- otherwise the embedded mod cannot link against the game.
    def reobfJar = tasks.named('reobfJar')
    dependsOn loaderJar, runtimeJar, reobfJar, syncLegacyLibs
    from('LICENSE', 'THIRD_PARTY_NOTICES.md', 'PORT_NOTICE.md')
    from('licenses') { into 'META-INF/licenses' }
    from(layout.buildDirectory.dir('legacy-libs')) {
        into 'META-INF/legacyconnector/libs'
    }
    from({ zipTree(loaderJar.get().archiveFile) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(runtimeJar) {
        into 'META-INF/legacyconnector'
        rename { 'legacyconnector-runtime.jar' }
    }
    manifest {
        attributes(
                'Automatic-Module-Name': 'legacyconnector.loader',
                'Implementation-Title': 'MC Compatibility',
                'Implementation-Version': project.version
        )
    }
}
tasks.named('assemble') { dependsOn 'bundleJar' }

// ./gradlew installBundle -PmodsDir=<instance>/mods : builds the distributable jar and replaces any older Legacy Connector jar in that folder.
tasks.register('installBundle', Copy) {
    group = 'build'
    description = 'Builds the bundled jar and copies it into the mods folder given by -PmodsDir.'
    dependsOn 'bundleJar'
    from(tasks.named('bundleJar'))
    doFirst {
        def dir = findProperty('modsDir')
        if (!dir) throw new GradleException('Pass the target mods folder: -PmodsDir=/path/to/instance/mods')
        fileTree(dir: dir, include: 'legacyconnector-*.jar').each { it.delete() }
        destinationDir = file(dir)
    }
    destinationDir = layout.buildDirectory.dir('installBundle-unset').get().asFile
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Legacy mods were compiled with FML access transformers applied to Minecraft; the shim mirrors that by making its
// classes and members public and non-final after compilation (see ShimAccessWidener).
tasks.named('compileJava', JavaCompile) {
    // The widener (and therefore the loader's legacy mapping downloads) is only needed for a runnable build,
    // not to type-check the sources: -PskipShimWidener keeps the compile-only loop fast.
    if (!project.hasProperty('skipShimWidener')) dependsOn ':loader:classes'
    // The widener rewrites the compiled classes in place; an incremental compile would read them back (widened) as
    // sources' dependencies. Without it (-PskipShimWidener) incremental compilation is what keeps the loop fast.
    options.incremental = project.hasProperty('skipShimWidener')
    def loaderClasspath = project(':loader').sourceSets.main.runtimeClasspath
    doLast {
        if (project.hasProperty('skipShimWidener')) {
            logger.lifecycle('skipShimWidener: the shim classes were not widened (compile-only iteration)')
            return
        }
        project.javaexec {
            executable = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }.get().executablePath.asFile.absolutePath
            classpath = loaderClasspath
            mainClass = 'org.kylepitcock.legacyconnector.loader.shim.ShimAccessWidener'
            args destinationDirectory.get().asFile.absolutePath
        }
    }
}

// Debug helper: prints the resolved compile classpath (used while porting to find the Forge/MC jars).
tasks.register('printCompileCp') {
    doLast {
        sourceSets.main.compileClasspath.files.each { println "CP " + it }
    }
}
