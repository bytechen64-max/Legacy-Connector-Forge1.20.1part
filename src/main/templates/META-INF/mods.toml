modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# The access transformer travels inside the jar (META-INF/accesstransformer.cfg) and Forge applies it automatically;
# the mixin configs are declared in the jar manifest ("MixinConfigs") by the `jar` task.

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional: legacy biomes are placed as a TerraBlender overworld region when it is installed.
[[dependencies."${mod_id}"]]
modId = "terrablender"
mandatory = false
versionRange = "[3.0,)"
ordering = "NONE"
side = "BOTH"
