# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G -Duser.language=en -Duser.country=US -Dnet.minecraftforge.gradle.check.certs=false -Dnet.minecraftforge.gradle.check.gradle=false -Dnet.minecraftforge.gradle.check.java=false
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
## Environment Properties
# Minecraft / Forge target of this port: the loader, the runtime mod and the shim all build for 1.20.1.
minecraft_version=1.20.1
# Release range of the game this build runs on.
minecraft_version_range=[1.20.1]
# The Forge version this build compiles and runs against (1.20.1 line).
forge_version=47.4.28
# Forge's own version range (the "forge" mod id).
forge_version_range=[47.4.20,48)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[47,)
# Official (Mojang) mappings: the shim and the bridges are written with the names 1.20.1 Forge exposes.
mapping_channel=official
mapping_version=1.20.1
## Mod Properties
# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=legacyconnector
# The human-readable display name for the mod.
mod_name=Legacy Connector (Forge 1.20.1 Port)
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. Pre-1.0: bump the PATCH for every release (0.4.1, 0.4.2, ...); bump the MINOR only for a milestone (new legacy version supported); 1.0.0 is reserved for when the project is ready.
mod_version=0.3.13-forge.1-alpha.1
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=org.kylepitcock.legacyconnector
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Kyle Pitcock (original); Forge Port Contributors (unofficial port)
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Unofficial Forge 1.20.1 port of Legacy Connector by Kyle Pitcock. Experimental compatibility for legacy Forge 1.7.10 and 1.12.2 mods through load-time translation. Maintained by Forge Port Contributors. Compatibility is tested separately from the upstream NeoForge version.

## Service-layer (FML) versions shipped by Forge 1.20.1-47.4.28; the :loader project compiles against exactly these.
forgespi_version=7.0.1
fmlloader_version=1.20.1-47.4.28
modlauncher_version=10.0.9
securejarhandler_version=2.1.10
eventbus_version=6.2.33
coremods_version=5.2.4
mixin_version=0.8.5
# MixinExtras is bundled by NeoForge but is a separate library on Forge; the three @WrapOperation mixins need it (Maven Central).
mixin_extras_version=0.3.5

## Legacy mapping data (MCP stable exports, SRG -> MCP names)
mcp_1_7_10=12-1.7.10
forge_1_7_10=1.7.10-10.13.4.1614-1.7.10
mcp_1_12_2=39-1.12
asm_version=9.10.1

## Optional integrations (compile-only), 1.20.1 Forge builds
curios_version=5.11.0+1.20.1
jade_version=11.13.1+forge
pehkui_version=3.8.2+1.20.1-forge
jei_version=15.20.0.135
create_version=mc1.20.1-6.0.8
terrablender_version=1.20.1-3.0.1.11

# ForgeGradle probes https://maven.minecraftforge.net/ and https://libraries.minecraft.net/ at configuration time and blocks
# for minutes when the TLS handshake stalls. Everything is resolved through Gradle's own downloader anyway.
systemProp.net.minecraftforge.gradle.check.certs=false
systemProp.net.minecraftforge.gradle.check.gradle=false
systemProp.net.minecraftforge.gradle.check.java=false
